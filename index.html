<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahve Durağı</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kahve Durağı">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: light;
  --bg: #F2F3EF;
  --surface: #FFFFFF;
  --surface-2: #F7F8F5;
  --ink: #17201C;
  --muted: #6A746F;
  --line: #E1E4DE;
  --accent: #1E5A47;
  --accent-ink: #F3F1E8;
  --accent-soft: #E2EDE8;
  --amber: #A86B12;
  --pay: #2E7A4E;
  --danger: #B3261E;
  --shadow: 0 1px 2px rgba(20, 40, 32, .06), 0 8px 24px rgba(20, 40, 32, .06);
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0E1311;
    --surface: #171E1B;
    --surface-2: #1C2521;
    --ink: #ECF1EE;
    --muted: #93A099;
    --line: #29332F;
    --accent: #1F5C49;
    --accent-ink: #F3F1E8;
    --accent-soft: #1D2E27;
    --amber: #E3AA4E;
    --pay: #72CC97;
    --danger: #FF8A80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--text); }
body {
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 96px) max(16px, env(safe-area-inset-left, 0px));
  -webkit-user-select: none; user-select: none;
  overscroll-behavior-y: none;
}
input { -webkit-user-select: text; user-select: text; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
.brand { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.brand small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }

/* Balance slip */
.slip { background: var(--accent); color: var(--accent-ink); border-radius: 22px; padding: 20px 20px 16px; position: relative; overflow: hidden; }
.slip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 64px; border-top: 1.5px dashed rgba(243, 241, 232, .28); }
.slip-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.slip-amount { font-size: 46px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; margin: 6px 0 4px; }
.slip-meta { font-size: 13px; opacity: .78; min-height: 18px; margin-bottom: 28px; }
.slip-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slip-actions button { height: 42px; border-radius: 12px; font-weight: 600; font-size: 15px; background: rgba(243, 241, 232, .14); color: var(--accent-ink); }
.slip-actions button.primary { background: var(--accent-ink); color: #1E5A47; }
.slip-actions button:active { transform: scale(.97); }

/* Section heads */
.head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.head .link { color: var(--accent); font-weight: 600; font-size: 15px; }
@media (prefers-color-scheme: dark) { .head .link { color: #7FCBAE; } }

/* Quick-add tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; background: var(--surface); border-radius: 16px; padding: 14px 12px 12px; text-align: left; min-height: 84px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); transition: transform .12s ease; }
.tile:active, .tile.bump { transform: scale(.94); }
.tile .name { font-size: 16px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.tile .price { font-size: 14px; color: var(--muted); }
.tile .count { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.tile.add { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); color: var(--muted); align-items: center; justify-content: center; font-weight: 600; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

/* Ledger */
.day { margin-bottom: 14px; }
.day-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); padding: 0 4px 6px; }
.day-head .num { font-weight: 600; }
.rows { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.row { width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 13px 16px; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row:active { background: var(--surface-2); }
.row .t { font-weight: 600; font-size: 15.5px; }
.row .t .qty { color: var(--muted); font-weight: 500; }
.row .s { font-size: 13px; color: var(--muted); }
.row .a { font-size: 16px; font-weight: 600; }
.row.pay .t, .row.pay .a { color: var(--pay); }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.more { width: 100%; padding: 12px; color: var(--accent); font-weight: 600; }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(8, 14, 12, .38); opacity: 0; transition: opacity .2s ease; z-index: 10; }
.backdrop.show { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
.sheet.show { transform: none; }
.sheet-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h3 { margin: 0; font-size: 19px; font-weight: 700; }
.sheet-head button { color: var(--muted); font-weight: 600; }
.group { background: var(--surface); border-radius: 14px; overflow: hidden; }
.field { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; padding: 0 14px; min-height: 50px; }
.field + .field { border-top: 1px solid var(--line); }
.field label { color: var(--muted); font-size: 14.5px; }
.field input { width: 100%; border: 0; background: transparent; font: 16px var(--text); color: var(--ink); text-align: right; padding: 12px 0; min-width: 0; }
.field input[type="date"], .field input[type="time"] { -webkit-appearance: none; appearance: none; display: flex; justify-content: flex-end; }
.stepper { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--ink); font-size: 20px; font-weight: 600; line-height: 1; }
.stepper span { min-width: 24px; text-align: center; font-size: 17px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.total-line { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.total-line span:first-child { color: var(--muted); }
.total-line .num { font-size: 24px; font-weight: 700; }
.btn { height: 50px; border-radius: 14px; font-weight: 600; font-size: 16px; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); }
.btn.danger { background: transparent; color: var(--danger); }
.btn.danger.arm { background: var(--danger); color: #fff; }
.btn:active { transform: scale(.98); }
.sub { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 4px 0; }
.menu-row { display: grid; grid-template-columns: 1fr 88px 34px; gap: 8px; align-items: center; padding: 6px 8px 6px 14px; }
.menu-row + .menu-row { border-top: 1px solid var(--line); }
.menu-row input { border: 0; background: transparent; font: 16px var(--text); color: var(--ink); padding: 10px 0; min-width: 0; width: 100%; }
.menu-row input.p { text-align: right; font-family: var(--num); }
.menu-row .x { width: 34px; height: 34px; border-radius: 50%; color: var(--danger); font-size: 20px; }
.note { font-size: 13px; color: var(--muted); padding: 0 4px; line-height: 1.45; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translate(-50%, 140%); z-index: 20;
  background: #17201C; color: #F3F1E8; border-radius: 14px; padding: 12px 14px 12px 16px; display: flex; align-items: center; gap: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .25); transition: transform .25s cubic-bezier(.2, .8, .2, 1); max-width: calc(100vw - 32px); white-space: nowrap; }
.toast.show { transform: translate(-50%, 0); }
.toast button { color: #8FD9BC; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Kahve Durağı<small id="today"></small></div>
    <button class="icon-btn" id="btn-settings" aria-label="Menü ve ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <section class="slip" aria-live="polite">
    <div class="slip-label">Toplam borç</div>
    <div class="slip-amount num" id="balance">₺0</div>
    <div class="slip-meta" id="slip-meta"></div>
    <div class="slip-actions">
      <button class="primary" id="btn-pay">Ödeme yap</button>
      <button id="btn-past">Geçmişe ekle</button>
    </div>
  </section>

  <section>
    <div class="head"><h2>Hızlı ekle</h2><button class="link" id="btn-edit-menu">Düzenle</button></div>
    <div class="tiles" id="tiles"></div>
    <div class="hint">Dokun, hemen deftere yazılsın. Yanlışsa aşağıdan kaydı düzelt.</div>
  </section>

  <section>
    <div class="head"><h2>Hareketler</h2></div>
    <div id="ledger"></div>
  </section>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="sheet-inner" id="sheet-body"></div></div>
<div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-undo">Geri al</button></div>

<script>
(() => {
  const KEY = 'veresiye.v1';
  const DEFAULT_MENU = [
    ['Çay', 15], ['Türk kahvesi', 60], ['Americano', 90],
    ['Latte', 110], ['Filtre kahve', 85], ['Su', 10]
  ];
  const $ = s => document.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- storage ----------
  let state;
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.menu) && Array.isArray(s.entries)) return s;
      }
    } catch (e) {}
    return { v: 1, menu: DEFAULT_MENU.map(([name, price]) => ({ id: uid(), name, price })), entries: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Kaydedilemedi: telefonun depolama alanını kontrol et'); }
  }
  state = load();
  save();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  // ---------- formatting ----------
  const nf0 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = n => {
    const r = Math.round(n * 100) / 100;
    return (r < 0 ? '−' : '') + '₺' + (Number.isInteger(r) ? nf0 : nf2).format(Math.abs(r));
  };
  const parseNum = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
  const pad = n => String(n).padStart(2, '0');
  const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const timeStr = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dayLabel = key => {
    const today = dayKey(Date.now());
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (key === today) return 'Bugün';
    if (key === dayKey(y)) return 'Dün';
    const [Y, M, D] = key.split('-').map(Number);
    const d = new Date(Y, M - 1, D);
    const opts = { day: 'numeric', month: 'long', weekday: 'long' };
    if (Y !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString('tr-TR', opts);
  };
  const amountOf = e => e.kind === 'pay' ? -e.amount : e.price * e.qty;

  // ---------- render ----------
  let shownDays = 14;
  function render() {
    const now = Date.now();
    $('#today').textContent = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });

    const balance = state.entries.reduce((s, e) => s + amountOf(e), 0);
    $('#balance').textContent = money(balance);

    const ym = dayKey(now).slice(0, 7);
    const monthSpend = state.entries.filter(e => e.kind === 'item' && dayKey(e.ts).startsWith(ym)).reduce((s, e) => s + e.price * e.qty, 0);
    const lastPay = state.entries.filter(e => e.kind === 'pay').sort((a, b) => b.ts - a.ts)[0];
    const meta = [`Bu ay ${money(monthSpend)} içildi`];
    if (lastPay) meta.push(`son ödeme ${new Date(lastPay.ts).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' })}`);
    $('#slip-meta').textContent = meta.join(' · ');

    // tiles
    const todayKey = dayKey(now);
    const todayCount = {};
    state.entries.forEach(e => { if (e.kind === 'item' && dayKey(e.ts) === todayKey) todayCount[e.name] = (todayCount[e.name] || 0) + e.qty; });
    $('#tiles').innerHTML = state.menu.map(m => `
      <button class="tile" data-id="${m.id}" aria-label="${esc(m.name)} ekle">
        ${todayCount[m.name] ? `<span class="count num">${todayCount[m.name]}</span>` : ''}
        <span class="name">${esc(m.name)}</span>
        <span class="price num">${money(m.price)}</span>
      </button>`).join('') + `<button class="tile add" id="tile-add">+ Ürün</button>`;

    // ledger
    const sorted = [...state.entries].sort((a, b) => b.ts - a.ts);
    if (!sorted.length) {
      $('#ledger').innerHTML = `<div class="empty">Henüz kayıt yok.<br>Yukarıdan bir içeceğe dokunarak başla.</div>`;
      return;
    }
    const groups = [];
    sorted.forEach(e => {
      const k = dayKey(e.ts);
      if (!groups.length || groups[groups.length - 1].key !== k) groups.push({ key: k, items: [] });
      groups[groups.length - 1].items.push(e);
    });
    const visible = groups.slice(0, shownDays);
    $('#ledger').innerHTML = visible.map(g => {
      const spent = g.items.filter(e => e.kind === 'item').reduce((s, e) => s + e.price * e.qty, 0);
      return `<div class="day">
        <div class="day-head"><span>${esc(dayLabel(g.key))}</span>${spent ? `<span class="num">${money(spent)}</span>` : ''}</div>
        <div class="rows">${g.items.map(rowHtml).join('')}</div>
      </div>`;
    }).join('') + (groups.length > shownDays ? `<button class="more" id="btn-more">Daha eski günleri göster</button>` : '');
  }
  function rowHtml(e) {
    if (e.kind === 'pay') {
      return `<button class="row pay" data-entry="${e.id}">
        <div><div class="t">Ödeme</div><div class="s">${timeStr(e.ts)}${e.note ? ' · ' + esc(e.note) : ''}</div></div>
        <div class="a num">−${money(e.amount)}</div></button>`;
    }
    return `<button class="row" data-entry="${e.id}">
      <div><div class="t">${esc(e.name)}${e.qty > 1 ? ` <span class="qty">× ${e.qty}</span>` : ''}</div>
      <div class="s">${timeStr(e.ts)}${e.qty > 1 ? ' · ' + money(e.price) + ' / adet' : ''}</div></div>
      <div class="a num">${money(e.price * e.qty)}</div></button>`;
  }

  // ---------- toast ----------
  let toastTimer, undoFn;
  function toast(text, undo) {
    $('#toast-text').textContent = text;
    undoFn = undo || null;
    $('#toast-undo').hidden = !undo;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('#toast').classList.remove('show'); undoFn = null; }, 3500);
  }
  $('#toast-undo').addEventListener('click', () => {
    if (undoFn) undoFn();
    undoFn = null;
    $('#toast').classList.remove('show');
  });

  // ---------- quick add ----------
  $('#tiles').addEventListener('click', ev => {
    const t = ev.target.closest('.tile');
    if (!t) return;
    if (t.id === 'tile-add') return openSettings(true);
    const m = state.menu.find(x => x.id === t.dataset.id);
    if (!m) return;
    const entry = { id: uid(), kind: 'item', name: m.name, price: m.price, qty: 1, ts: Date.now() };
    state.entries.push(entry);
    save(); render();
    const el = document.querySelector(`.tile[data-id="${m.id}"]`);
    if (el) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 140); }
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    toast(`${m.name} eklendi · ${money(m.price)}`, () => {
      state.entries = state.entries.filter(x => x.id !== entry.id);
      save(); render();
    });
  });

  $('#ledger').addEventListener('click', ev => {
    if (ev.target.id === 'btn-more') { shownDays += 30; render(); return; }
    const r = ev.target.closest('[data-entry]');
    if (!r) return;
    const e = state.entries.find(x => x.id === r.dataset.entry);
    if (e) e.kind === 'pay' ? openPay(e) : openItem(e);
  });

  // ---------- sheet ----------
  const sheet = $('#sheet'), backdrop = $('#backdrop');
  function openSheet(html, bind) {
    $('#sheet-body').innerHTML = `<div class="grab"></div>` + html;
    sheet.hidden = false; backdrop.hidden = false;
    requestAnimationFrame(() => { sheet.classList.add('show'); backdrop.classList.add('show'); });
    sheet.scrollTop = 0;
    bind && bind($('#sheet-body'));
  }
  function closeSheet() {
    sheet.classList.remove('show'); backdrop.classList.remove('show');
    setTimeout(() => { sheet.hidden = true; backdrop.hidden = true; $('#sheet-body').innerHTML = ''; }, 260);
    render();
  }
  backdrop.addEventListener('click', closeSheet);

  const dateVal = ts => dayKey(ts);
  const combine = (d, t) => {
    const [Y, M, D] = d.split('-').map(Number);
    const [h, m] = (t || '12:00').split(':').map(Number);
    return new Date(Y, M - 1, D, h, m).getTime();
  };
  function armDelete(btn, onConfirm) {
    let armed = false;
    btn.addEventListener('click', () => {
      if (armed) return onConfirm();
      armed = true;
      btn.classList.add('arm');
      btn.textContent = 'Silmek için tekrar dokun';
      setTimeout(() => { armed = false; btn.classList.remove('arm'); btn.textContent = btn.dataset.label; }, 3000);
    });
  }

  // item editor (new past entry or existing)
  function openItem(entry) {
    const isNew = !entry;
    const d = entry ? { ...entry } : { kind: 'item', name: state.menu[0]?.name || '', price: state.menu[0]?.price || 0, qty: 1, ts: Date.now() };
    openSheet(`
      <div class="sheet-head"><h3>${isNew ? 'Geçmişe ekle' : 'Kaydı düzelt'}</h3><button data-close>Vazgeç</button></div>
      <div class="chips" id="pick">${state.menu.map(m => `<button class="chip${m.name === d.name ? ' on' : ''}" data-name="${esc(m.name)}" data-price="${m.price}">${esc(m.name)}</button>`).join('')}</div>
      <div class="group">
        <div class="field"><label for="f-name">Ürün</label><input id="f-name" value="${esc(d.name)}" autocomplete="off"></div>
        <div class="field"><label for="f-price">Birim fiyat</label><input id="f-price" class="num" inputmode="decimal" value="${String(d.price).replace('.', ',')}"></div>
        <div class="field"><label>Adet</label><div class="stepper"><button data-step="-1" aria-label="Azalt">−</button><span class="num" id="f-qty">${d.qty}</span><button data-step="1" aria-label="Arttır">+</button></div></div>
      </div>
      <div class="group">
        <div class="field"><label for="f-date">Tarih</label><input id="f-date" type="date" value="${dateVal(d.ts)}" max="${dayKey(Date.now())}"></div>
        <div class="field"><label for="f-time">Saat</label><input id="f-time" type="time" value="${timeStr(d.ts)}"></div>
      </div>
      <div class="total-line"><span>Tutar</span><span class="num" id="f-total"></span></div>
      <button class="btn primary" id="f-save">${isNew ? 'Deftere yaz' : 'Kaydet'}</button>
      ${isNew ? '' : '<button class="btn danger" id="f-del" data-label="Kaydı sil">Kaydı sil</button>'}
    `, root => {
      const qtyEl = root.querySelector('#f-qty');
      const priceEl = root.querySelector('#f-price');
      const nameEl = root.querySelector('#f-name');
      const upd = () => {
        const p = parseNum(priceEl.value);
        root.querySelector('#f-total').textContent = isNaN(p) ? '—' : money(p * d.qty);
        root.querySelectorAll('#pick .chip').forEach(c => c.classList.toggle('on', c.dataset.name === nameEl.value.trim()));
      };
      upd();
      root.querySelector('[data-close]').onclick = closeSheet;
      root.querySelector('#pick').addEventListener('click', ev => {
        const c = ev.target.closest('.chip'); if (!c) return;
        nameEl.value = c.dataset.name;
        priceEl.value = c.dataset.price.replace('.', ',');
        upd();
      });
      root.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
        d.qty = Math.max(1, d.qty + Number(b.dataset.step));
        qtyEl.textContent = d.qty; upd();
      });
      priceEl.addEventListener('input', upd);
      nameEl.addEventListener('input', upd);
      root.querySelector('#f-save').onclick = () => {
        const name = nameEl.value.trim();
        const price = parseNum(priceEl.value);
        const date = root.querySelector('#f-date').value;
        if (!name) return toast('Ürün adını yaz');
        if (isNaN(price) || price < 0) return toast('Geçerli bir fiyat gir');
        if (!date) return toast('Tarih seç');
        const rec = { id: d.id || uid(), kind: 'item', name, price, qty: d.qty, ts: combine(date, root.querySelector('#f-time').value) };
        if (isNew) state.entries.push(rec);
        else state.entries = state.entries.map(x => x.id === rec.id ? rec : x);
        save(); closeSheet();
        toast(isNew ? `${name} ${dayLabel(dayKey(rec.ts)).toLowerCase()} için eklendi` : 'Kayıt güncellendi');
      };
      const del = root.querySelector('#f-del');
      if (del) armDelete(del, () => {
        const removed = state.entries.find(x => x.id === d.id);
        state.entries = state.entries.filter(x => x.id !== d.id);
        save(); closeSheet();
        toast('Kayıt silindi', () => { state.entries.push(removed); save(); render(); });
      });
    });
  }

  // payment editor
  function openPay(entry) {
    const isNew = !entry;
    const balance = state.entries.reduce((s, e) => s + amountOf(e), 0) + (entry ? entry.amount : 0);
    const d = entry ? { ...entry } : { kind: 'pay', amount: Math.max(0, balance), ts: Date.now(), note: '' };
    openSheet(`
      <div class="sheet-head"><h3>${isNew ? 'Ödeme yap' : 'Ödemeyi düzelt'}</h3><button data-close>Vazgeç</button></div>
      <div class="chips">
        <button class="chip" data-amt="${Math.max(0, balance)}">Borcun tamamı · ${money(Math.max(0, balance))}</button>
        ${[100, 200, 500].map(a => `<button class="chip" data-amt="${a}">${money(a)}</button>`).join('')}
      </div>
      <div class="group">
        <div class="field"><label for="p-amt">Tutar</label><input id="p-amt" class="num" inputmode="decimal" value="${String(Math.round(d.amount * 100) / 100).replace('.', ',')}"></div>
        <div class="field"><label for="p-note">Not</label><input id="p-note" value="${esc(d.note || '')}" placeholder="İsteğe bağlı" autocomplete="off"></div>
      </div>
      <div class="group">
        <div class="field"><label for="p-date">Tarih</label><input id="p-date" type="date" value="${dateVal(d.ts)}" max="${dayKey(Date.now())}"></div>
        <div class="field"><label for="p-time">Saat</label><input id="p-time" type="time" value="${timeStr(d.ts)}"></div>
      </div>
      <div class="total-line"><span>Ödemeden sonra kalan</span><span class="num" id="p-left"></span></div>
      <button class="btn primary" id="p-save">${isNew ? 'Ödemeyi kaydet' : 'Kaydet'}</button>
      ${isNew ? '' : '<button class="btn danger" id="p-del" data-label="Ödemeyi sil">Ödemeyi sil</button>'}
    `, root => {
      const amtEl = root.querySelector('#p-amt');
      const upd = () => { const a = parseNum(amtEl.value); root.querySelector('#p-left').textContent = isNaN(a) ? '—' : money(balance - a); };
      upd();
      amtEl.addEventListener('input', upd);
      root.querySelector('[data-close]').onclick = closeSheet;
      root.querySelectorAll('[data-amt]').forEach(c => c.onclick = () => {
        amtEl.value = String(Math.round(Number(c.dataset.amt) * 100) / 100).replace('.', ','); upd();
      });
      root.querySelector('#p-save').onclick = () => {
        const amount = parseNum(amtEl.value);
        const date = root.querySelector('#p-date').value;
        if (isNaN(amount) || amount <= 0) return toast('Geçerli bir tutar gir');
        if (!date) return toast('Tarih seç');
        const rec = { id: d.id || uid(), kind: 'pay', amount, note: root.querySelector('#p-note').value.trim(), ts: combine(date, root.querySelector('#p-time').value) };
        if (isNew) state.entries.push(rec);
        else state.entries = state.entries.map(x => x.id === rec.id ? rec : x);
        save(); closeSheet();
        toast(isNew ? `${money(amount)} ödeme kaydedildi` : 'Ödeme güncellendi');
      };
      const del = root.querySelector('#p-del');
      if (del) armDelete(del, () => {
        const removed = state.entries.find(x => x.id === d.id);
        state.entries = state.entries.filter(x => x.id !== d.id);
        save(); closeSheet();
        toast('Ödeme silindi', () => { state.entries.push(removed); save(); render(); });
      });
    });
  }

  // settings: menu + backup
  function openSettings(focusNew) {
    const menuRows = () => state.menu.map(m => `
      <div class="menu-row" data-id="${m.id}">
        <input class="n" value="${esc(m.name)}" aria-label="Ürün adı" autocomplete="off">
        <input class="p num" inputmode="decimal" value="${String(m.price).replace('.', ',')}" aria-label="Fiyat">
        <button class="x" aria-label="${esc(m.name)} sil">×</button>
      </div>`).join('');
    openSheet(`
      <div class="sheet-head"><h3>Menü ve ayarlar</h3><button data-close>Bitti</button></div>
      <div class="sub">Menü</div>
      <div class="group" id="menu-list">${menuRows()}</div>
      <button class="btn ghost" id="m-add">+ Ürün ekle</button>
      <p class="note">Fiyat değişince eski kayıtlar etkilenmez; her kayıt eklendiği andaki fiyatı saklar.</p>
      <div class="sub">Yedek</div>
      <div class="group">
        <button class="btn ghost" id="b-export" style="border-radius:0">Yedeği dışa aktar</button>
        <button class="btn ghost" id="b-import" style="border-radius:0;border-top:1px solid var(--line)">Yedekten geri yükle</button>
      </div>
      <input type="file" id="b-file" accept="application/json,.json" hidden>
      <p class="note">Veriler yalnızca bu telefonda saklanır, hiçbir yere gönderilmez. Arada bir yedek alıp Dosyalar'a kaydetmen iyi olur.</p>
      <button class="btn danger" id="b-wipe" data-label="Tüm kayıtları sil">Tüm kayıtları sil</button>
    `, root => {
      root.querySelector('[data-close]').onclick = closeSheet;
      const list = root.querySelector('#menu-list');
      list.addEventListener('change', ev => {
        const row = ev.target.closest('.menu-row'); if (!row) return;
        const m = state.menu.find(x => x.id === row.dataset.id); if (!m) return;
        if (ev.target.classList.contains('n')) {
          const v = ev.target.value.trim();
          if (v) m.name = v; else ev.target.value = m.name;
        } else {
          const p = parseNum(ev.target.value);
          if (!isNaN(p) && p >= 0) m.price = p; else ev.target.value = String(m.price).replace('.', ',');
        }
        save();
      });
      list.addEventListener('click', ev => {
        const x = ev.target.closest('.x'); if (!x) return;
        const row = x.closest('.menu-row');
        const idx = state.menu.findIndex(m => m.id === row.dataset.id);
        const [removed] = state.menu.splice(idx, 1);
        save(); row.remove();
        toast(`${removed.name} menüden çıkarıldı`, () => { state.menu.splice(idx, 0, removed); save(); render(); if (!sheet.hidden) list.innerHTML = menuRows(); });
      });
      const addNew = () => {
        const m = { id: uid(), name: 'Yeni ürün', price: 0 };
        state.menu.push(m); save();
        list.innerHTML = menuRows();
        const inp = list.querySelector(`[data-id="${m.id}"] .n`);
        inp.focus(); inp.select();
      };
      root.querySelector('#m-add').onclick = addNew;
      if (focusNew === true) addNew();

      root.querySelector('#b-export').onclick = async () => {
        const name = `kahve-duragi-yedek-${dayKey(Date.now())}.json`;
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const file = new File([blob], name, { type: 'application/json' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Kahve Durağı yedeği' }); return; }
        } catch (e) { if (e && e.name === 'AbortError') return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      };
      const fileEl = root.querySelector('#b-file');
      root.querySelector('#b-import').onclick = () => fileEl.click();
      fileEl.onchange = async () => {
        const f = fileEl.files[0]; if (!f) return;
        try {
          const s = JSON.parse(await f.text());
          if (!s || !Array.isArray(s.menu) || !Array.isArray(s.entries)) throw 0;
          const prev = state;
          state = s; save(); closeSheet();
          toast(`${s.entries.length} kayıt geri yüklendi`, () => { state = prev; save(); render(); });
        } catch (e) { toast('Bu dosya bir Kahve Durağı yedeği değil'); }
      };
      armDelete(root.querySelector('#b-wipe'), () => {
        const prev = state.entries;
        state.entries = []; save(); closeSheet();
        toast('Tüm kayıtlar silindi', () => { state.entries = prev; save(); render(); });
      });
    });
  }

  $('#btn-pay').onclick = () => openPay();
  $('#btn-past').onclick = () => openItem();
  $('#btn-settings').onclick = () => openSettings();
  $('#btn-edit-menu').onclick = () => openSettings();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  render();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
